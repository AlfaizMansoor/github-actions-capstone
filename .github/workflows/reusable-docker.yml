name: docker reusable

on:
    workflow_call:
        inputs:
            image_name:
                type: string
                required: true
            tag:
                type: string
                required: false
                default: 'latest'
        outputs:
            image_url: 
                description: "The full image path"
                value: ${{ jobs.build-docker.outputs.image_url }}

jobs:
    build-docker:
        runs-on: ubuntu-latest
        outputs: 
            image_url: ${{ steps.url_image.outputs.image_url }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Docker hub login
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_TOKEN}}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: docker build and push
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tag: ${{secrets.DOCKER_USERNAME}}/github-actions-capstone:latest

            - name: image set
              id: url_image
              run: |
                FULL_IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}"
                echo "image_url=${FULL_IMAGE}" >> $GITHUB_OUTPUT

