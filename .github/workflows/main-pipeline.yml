name: main branch pipeline

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs: 
    build-test:
        uses: ./.github/workflows/reusable-build-test.yml

    docker-build:
        needs: [build-test]
        uses: ./.github/workflows/reusable-docker.yml
        with:
            image_name: 'github-actions-capstone'
            tag: "latest,sha-${{github.sha}}"
        secrets: inherit

    docker-scan:
        needs: [docker-build]
        uses: ./.github/workflows/docker-image-scan.yml
        secrets: inherit

    deploy:
        needs: [docker-scan]
        runs-on: ubuntu-latest
        steps:
            - name: deploying image
              run: echo "Deploying image:${{ needs.docker-build.outputs.image_url }} to production"
